<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1240" viewBox="0 0 1760 1240" role="img" aria-labelledby="title desc">
<title id="title">PokeSettle 시스템 구조</title><desc id="desc">브라우저에서 CloudFront와 Lightsail Nginx를 거쳐 Next.js와 FastAPI에 연결. FastAPI가 RAG, 전투 계산, PostgreSQL과 외부 자료 및 모델 호출 담당. GitHub Actions로 검증한 이미지를 배포하고 Grafana로 관측.</desc>
